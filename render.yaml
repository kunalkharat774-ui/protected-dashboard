services:
  - type: web
    name: security-dashboard
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: ISMALICIOUS_API_KEY
        sync: false
